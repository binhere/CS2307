services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # minio/minio and minio/mc are no longer published on Docker Hub; Chainguard builds
  # are used instead (as in databases/object_storage). They ship without a shell or
  # curl, so there is no healthcheck and the bucket job retries until MinIO is up.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    env_file: .env
    user: "0"   # write the named volume created by earlier root-based images
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      - MC_HOST_local=http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: ["mb", "--ignore-existing", "local/${MINIO_BUCKET_NAME}"]
    restart: on-failure

  # Query and catalog embeddings on CPU (no GPU needed). The model is downloaded into
  # the ollama_models volume on first start; later starts reuse it.
  embedding:
    image: ollama/ollama:0.19.0
    restart: unless-stopped
    environment:
      - EMBEDDING_MODEL=${SEARCH_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull \"$$EMBEDDING_MODEL\" && wait"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-import-init:
    image: busybox:1.36
    profiles: ["graph-tools", "graph-search"]
    volumes:
      - ./data/v3/graph:/source:ro
      - neo4j_import:/target
    command: ["sh", "-c", "cp -R /source/. /target/"]
    restart: "no"

  neo4j:
    image: neo4j:5-community
    profiles: ["graph-tools", "graph-search"]
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/changeme}
      - GRAPH_USER=${NEO4J_USER:-neo4j}
      - GRAPH_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_import:/var/lib/neo4j/import/real_estate_graph_ready
      - ./backend/scripts/neo4j:/opt/search-graph:ro
    depends_on:
      neo4j-import-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./.env:/app/.env:ro
      - ./data:/app/data:ro
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  ollama_models:
  minio_data:
  neo4j_data:
  neo4j_import:
